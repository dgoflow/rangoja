[project]
name = "rangoja"
version = "0.1.0"
description = "Atendimento do RangoJá (app de delivery fictício): do prompt ao agente robusto"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-adk==1.33.0",
    "pydantic>=2",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "nbmake>=1.5", "ruff>=0.5", "jupyterlab>=4", "ipywidgets>=8"]
observabilidade = ["arize-phoenix>=4", "openinference-instrumentation-google-adk>=0.1.4,<1", "fastmcp"]  # o Phoenix 20 importa o cliente do fastmcp
live = ["litellm==1.82.6"]  # ADK usa LiteLlm para OpenAI; versões mais novas conflitam com o mcp exigido pelo ADK

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rangoja"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # docstrings e tabelas em português passam de 120 colunas
