[project]
name = "rangoja"
version = "0.1.0"
description = "Do prompt ao agente robusto: a transição de capacidades com o atendimento do RangoJá (app de delivery fictício)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-adk==1.33.0",
    "litellm==1.82.6",  # o ADK fala com a OpenAI pelo LiteLlm; versões mais novas conflitam com o ADK 1.33
    "pydantic>=2",
    "python-dotenv>=1",
    "jupyterlab>=4",
]

[tool.uv]
package = false  # não há pacote: tudo está nos notebooks
