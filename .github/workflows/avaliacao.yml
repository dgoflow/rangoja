name: avaliacao

# Testes com modelo real (estabilidade, golden, metamórficos). Custa tokens: roda por agenda e sob demanda.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RANGOJA_MODO: live
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,live]"
      - name: Testes live contra v3
        run: pytest tests/ -m live --versao v3 -q --junitxml=relatorio-live.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-live
          path: relatorio-live.xml
