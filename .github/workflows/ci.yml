name: ci

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RANGOJA_MODO: replay        # sem chave e sem rede: tudo vem de gravações e roteiros
      RANGOJA_PHOENIX: "off"      # não sobe o servidor no CI; o pacote é instalado e o trace fica em texto
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar (versões travadas em uv.lock)
        run: |
          uv sync --locked --extra dev --extra live
          uv run python -m ipykernel install --user --name rangoja
      - name: Lint
        run: uv run ruff check .
      - name: Gravações em dia
        run: uv run python scripts/verificar_gravacoes.py
      - name: Testes (v3, sem testes live)
        run: uv run pytest tests/ -m "not live" -q
      - name: Notebooks (replay)
        run: uv run pytest --nbmake --nbmake-kernel=rangoja -q notebooks/0*.ipynb notebooks/extras/x[123]*.ipynb
